services:
  backend:
    build:
      context: ./backend
    container_name: web-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/blog:/app/blog
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: web-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped 