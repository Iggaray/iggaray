services:
  backend:
    build:
      context: ./backend
    container_name: web-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/blog:/app/blog  # For live blog editing
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
    container_name: web-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      - backend